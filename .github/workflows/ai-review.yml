# Demo: revisor de PRs con IA (tipo CodeRabbit) en ~30 líneas.
name: Revisión con IA
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number }}

            Eres el revisor de código del equipo. Revisa SOLO el diff de este PR (`gh pr diff`).
            Busca bugs reales: lógica, fugas, casos borde, seguridad. No comentes estilo ni gustos.

            Por cada hallazgo grave deja un comentario EN LA LÍNEA con
            mcp__github_inline_comment__create_inline_comment, en español, con este formato:
            **[P0|P1] Título corto**
            Qué falla: una frase concreta.
            Cómo se rompe: el caso exacto (entrada → resultado).
            Arreglo: el código sugerido en un bloque ```suggestion``` si cabe.

            P0 = rompe en producción o seguridad. P1 = bug probable. Lo menor NO se comenta.
            Al final deja UN comentario general con `gh pr comment`: veredicto en 1 línea
            y una lista de los hallazgos (severidad + título).
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Read,Grep,Glob"
